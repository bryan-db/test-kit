# Databricks Asset Bundle Configuration
# Feature: 003-databricks-asset-bundles
# Purpose: Package test-kit for deployment across dev and prod environments

bundle:
  name: test-kit

# Variables: Environment-agnostic configuration with target-specific overrides
variables:
  catalog_name:
    description: "Unity Catalog name for all data assets"
    default: bryan_li

  schema_name:
    description: "Schema name (environment-specific: synthetic_datasets_dev or synthetic_datasets_prod)"
    # No default - must be provided by target

  cluster_node_type:
    description: "EC2 instance type for cluster nodes"
    # No default - must be provided by target

  cluster_num_workers:
    description: "Number of worker nodes in the cluster"
    # No default - must be provided by target

# Resources: Job and App definitions
resources:
  # T009: Serverless SQL Warehouse for analytics pipelines
  sql_warehouses:
    analytics_warehouse:
      name: "marketing-analytics-warehouse-${bundle.target}"
      cluster_size: "Small"
      enable_photon: true
      enable_serverless_compute: true
      auto_stop_mins: 10
      tags:
        custom_tags:
          - key: "feature"
            value: "004-data-exploration-frontend"
          - key: "purpose"
            value: "gold-layer-transformations"

  jobs:
    # Feature 001: Synthetic data generation job
    synthetic_data_generation:
      name: "synthetic-data-generation-${bundle.target}"

      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: databricks_app/generation_notebook.py
            base_parameters:
              catalog: "${var.catalog_name}"
              schema: "${var.schema_name}"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "${var.cluster_node_type}"
            num_workers: "${var.cluster_num_workers}"
            spark_conf:
              "spark.databricks.delta.optimizeWrite.enabled": "true"
              "spark.databricks.delta.autoCompact.enabled": "true"
            data_security_mode: USER_ISOLATION

          libraries:
            - pypi:
                package: "dbldatagen>=0.3.0"
            - pypi:
                package: "faker>=18.0.0"

      # Job-level configuration
      max_concurrent_runs: 1
      timeout_seconds: 3600

      email_notifications:
        on_failure:
          - bryan.li@databricks.com

    # Feature 004: Marketing Analytics ETL Pipeline (T029 - Hourly refresh)
    marketing_analytics_etl:
      name: "marketing-analytics-etl-${bundle.target}"

      tasks:
        # Task 1: Bronze to Silver (Data Cleansing)
        - task_key: bronze_to_silver
          notebook_task:
            notebook_path: databricks_app/src/pipelines/bronze_to_silver.py
            base_parameters:
              catalog: "${var.catalog_name}"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "${var.cluster_node_type}"
            num_workers: "${var.cluster_num_workers}"
            spark_conf:
              "spark.databricks.delta.optimizeWrite.enabled": "true"
              "spark.databricks.delta.autoCompact.enabled": "true"
              "spark.databricks.photon.enabled": "true"
            data_security_mode: USER_ISOLATION

        # Task 2: Silver to Gold (Metric Aggregation)
        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver

          notebook_task:
            notebook_path: databricks_app/src/pipelines/silver_to_gold.py
            base_parameters:
              catalog: "${var.catalog_name}"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "${var.cluster_node_type}"
            num_workers: "${var.cluster_num_workers}"
            spark_conf:
              "spark.databricks.delta.optimizeWrite.enabled": "true"
              "spark.databricks.delta.autoCompact.enabled": "true"
              "spark.databricks.photon.enabled": "true"
            data_security_mode: USER_ISOLATION

        # Task 3: Sync Table Refresh (Lakebase publish)
        - task_key: sync_table_refresh
          depends_on:
            - task_key: silver_to_gold

          notebook_task:
            notebook_path: databricks_app/src/pipelines/sync_table_refresh.py
            base_parameters:
              catalog: "${var.catalog_name}"
              action: "refresh"

          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            data_security_mode: USER_ISOLATION

      schedule:
        quartz_cron_expression: "0 0 * * * ?"  # Run hourly at minute 0
        timezone_id: "America/Los_Angeles"
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 3600

      email_notifications:
        on_failure:
          - bryan.li@databricks.com

  # apps:
  #   synthetic_data_generator:
  #     name: "synthetic-data-generator-${bundle.target}"
  #     description: "React application for configuring and triggering synthetic identity graph data generation"

